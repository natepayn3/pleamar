[package]
name = "pleamar"
version = "0.7.25"
edition = "2024"
license = "BSD-3-Clause"
description = "A desktop shell language and runtime where animation does not depend on logic"
repository = "https://github.com/k4ditano/pleamar"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
# The scenes' own shaders are read and checked with the same compiler wgpu
# uses, already in the tree: a mistake is reported with its line, never a crash.
naga = { version = "30", features = ["wgsl-in"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# The sounds a scene plays itself are WAV, read here, or Ogg Vorbis, read with this.
lewton = "0.10"
mlua = { version = "0.12", features = ["luau", "send"], optional = true }
pollster = "1.0.1"
resvg = { version = "0.48.1", default-features = false, features = ["raster-images"] }
serde_json = "1.0.151"
typed-arena = "2.0.2"
wgpu = "30"
# The terminals a scene holds (`terminal`): the emulator Alacritty and Zed use —the
# escape codes, the grid, its history, selecting—, with its pty on Linux, macOS and Windows.
alacritty_terminal = "0.26"

# What belongs to each system, only on that system. The core depends on none of this.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = "5"
# Sound, spoken to directly: PulseAudio's protocol, which PipeWire speaks too
# (pipewire-pulse). Pure Rust: no C library, nothing to spawn.
pulseaudio = "0.3"
raw-window-handle = "0.6"
# To ask the card which layouts of a program's memory it can read (dmabuf
# modifiers): the same ash wgpu speaks Vulkan with.
ash = "0.38"
# A card whose Vulkan driver names no layouts paints its monitors through
# OpenGL (`dmabuf::import_gl`): the same versions wgpu's OpenGL side uses.
glow = "0.17"
khronos-egl = { version = "6", features = ["dynamic"] }
smithay-client-toolkit = "0.21"
wayland-client = { version = "0.31", features = ["system"] }
# The protocols every compositor understands: windows and desktops.
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# What the clipboard offers (a picture with its HTML), without reading it.
wl-clipboard-rs = "0.9"
# fontconfig gives the system's font aliases ("sans-serif" → whichever it is). Without it,
# on Windows and macOS, fontdb reads the font folders directly.
cosmic-text = { version = "0.19.0", default-features = false, features = ["fontconfig"] }

# The Luau logic brings a C++ compiler with it: Luau is built from its
# sources. It is a feature so that the core can be checked against other
# systems even without a cross compiler here. See portable.sh.
[features]
default = ["luau"]
luau = ["dep:mlua"]
